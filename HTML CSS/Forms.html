<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      Username: <input type="text" name="uname" maxlength="5" /> <br />
      Password: <input type="password" name="upass" /> <br />
      Gender: <input type="radio" name="gender" value="male" /> Male
      <input type="radio" name="gender" value="female" /> Female <br />
      Courses: <input type="checkbox" name="course" value="HTML" /> HTML
      <input type="checkbox" name="course" value="CSS" /> CSS
      <input type="checkbox" name="course" value="Javascript" checked />
      Javascript
      <br/>
      Age Group: <select name="age">
        <option value="">10-20</option>
        <option value="">20-30</option>
        <option value="">30-40</option>
        <option value="">40-50</option>
        <option value="">50-60</option>
        <option value="">60-70</option>
      </select> <br/>
      Comment: <textarea name="comment" rows="5" cols="9"></textarea>
      <br/>
      <input type="submit" value="submit">
      <input type="reset" value="reset">
    </form>
  </body>
</html>
